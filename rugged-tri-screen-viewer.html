});
canvas.addEventListener('pointermove',event=>{
  const previous=pointers.get(event.pointerId);
  if(!previous){
    if(event.pointerType==='mouse')canvas.toggleAttribute('data-hinge',phase==='open'&&!event.shiftKey&&!!pickPanel(event.clientX,event.clientY));
    return;
  }
  const oldDistance=pointers.size===2?separation():0;
  pointers.set(event.pointerId,{x:event.clientX,y:event.clientY});
  if(pointers.size===2){
    const distance=separation();
    if(oldDistance>1&&distance>1)zoomBy(distance/oldDistance);
  }else {
    const dx=event.clientX-previous.x,dy=event.clientY-previous.y;
    if(grip)dragHinge(grip,dx,dy);
    else orbit(dx,dy);
  }
});
for(const type of ['pointerup','pointercancel','lostpointercapture']){
  canvas.addEventListener(type,event=>{
    if(!pointers.delete(event.pointerId))return;
    releaseHinge(type==='pointerup');
    delete canvas.dataset.hinge;
  });
}
canvas.addEventListener('pointerleave',()=>{if(!pointers.size)delete canvas.dataset.hinge;});
canvas.addEventListener('wheel',event=>{
  event.preventDefault();
  const multiplier=event.deltaMode===1?16:event.deltaMode===2?canvas.clientHeight:1;
  zoomBy(Math.exp(-event.deltaY*multiplier*.0012));
},{passive:false});
const arrowKeys={ArrowLeft:[-17,0],ArrowRight:[17,0],ArrowUp:[0,-17],ArrowDown:[0,17]};
canvas.addEventListener('keydown',event=>{
  if(arrowKeys[event.key]){rotate(false);orbit(...arrowKeys[event.key]);}
  else if(event.key==='+'||event.key==='=')zoomBy(1.2);
  else if(event.key==='-')zoomBy(1/1.2);
  else if(event.key==='Home')preset({});
  else return;
  event.preventDefault();
});
canvas.addEventListener('webglcontextlost',()=>{
  rotate(false);showError('3D 표시가 중단되었습니다. 페이지를 새로고침해 주세요.');
});
new ResizeObserver(refresh).observe(canvas);
refresh();
} catch (error) {
  console.error(error);
  showError('3D 모델을 시작하지 못했습니다. 브라우저에서 WebGL이 켜져 있는지 확인해 주세요.');
}
})();
</script>
</body>
</html>
